name: "Poltergeist: exe + APK"

# Gera o executavel portatil do Windows (PyInstaller) e o APK Android, cada um
# com o seu SHA-256. Em tags v* publica os quatro arquivos na release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias do servidor e do build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install pyinstaller

      - name: Conferir versao do server.py com a tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re, sys
          codigo = open("server/server.py", encoding="utf-8").read()
          versao = re.search(r'VERSION = "([^"]+)"', codigo).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if versao != tag:
              sys.exit(f"tag {tag} != VERSION {versao} em server.py")

      - name: Gerar icones
        working-directory: server
        run: python gerar_icone_exe.py

      - name: Empacotar
        working-directory: server
        run: python -m PyInstaller Poltergeist.spec --noconfirm --clean

      - name: Garantir que nenhum segredo entrou no pacote
        working-directory: server
        shell: pwsh
        run: |
          $segredos = @("pin.txt", "devices.json", "auth_state.json", "cert.pem", "key.pem", "server.log")
          foreach ($s in $segredos) {
            if (Test-Path "dist/$s") { throw "Arquivo sensivel encontrado no pacote: dist/$s" }
          }

      - name: Checksum SHA-256
        working-directory: server
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Poltergeist.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Poltergeist.exe" | Set-Content dist/Poltergeist.exe.sha256 -Encoding ascii

      - name: Guardar o executavel e o checksum
        uses: actions/upload-artifact@v4
        with:
          name: Poltergeist-windows
          if-no-files-found: error
          path: |
            server/dist/Poltergeist.exe
            server/dist/Poltergeist.exe.sha256

  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Conferir versao do app com a tag
        id: meta
        working-directory: android
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$version" ]; then
            echo "versionName nao encontrado em app/build.gradle.kts" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$tag" && "$version" != "$tag".* ]]; then
              echo "tag $tag != versionName $version em build.gradle.kts" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Preparar a chave de assinatura
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Secret ANDROID_KEYSTORE_B64 ausente: configure os secrets de assinatura." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/poltergeist-release.jks"
          test -s "$RUNNER_TEMP/poltergeist-release.jks"

      - name: Compilar o APK de release
        working-directory: android
        shell: bash
        env:
          POLTERGEIST_KEYSTORE: ${{ runner.temp }}/poltergeist-release.jks
          POLTERGEIST_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POLTERGEIST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POLTERGEIST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_HOME" ]; then echo "sdk.dir=$ANDROID_HOME" > local.properties; fi
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Conferir a assinatura
        shell: bash
        run: |
          # Impede publicar um APK assinado com a chave de debug local: a
          # impressao digital precisa ser a da chave de release.
          esperado="160d9b1347f6801589bafd8d058aa397a8bec820111403d98bb2aa8a22947845"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          saida=$("$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk)
          echo "$saida" | grep "SHA-256 digest"
          if ! echo "$saida" | grep -qi "$esperado"; then
            echo "APK assinado com uma chave diferente da de release." >&2
            exit 1
          fi

      - name: Nomear e gerar o checksum
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/Poltergeist-${{ steps.meta.outputs.version }}.apk"
          cd dist
          sha256sum "Poltergeist-${{ steps.meta.outputs.version }}.apk" \
            > "Poltergeist-${{ steps.meta.outputs.version }}.apk.sha256"

      - name: Guardar o APK e o checksum
        uses: actions/upload-artifact@v4
        with:
          name: Poltergeist-android
          if-no-files-found: error
          path: dist/*

  release:
    needs: [exe, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Poltergeist-*
          merge-multiple: true

      - name: Calcular os hashes
        id: hashes
        shell: bash
        run: |
          exe=$(awk '{print $1}' dist/Poltergeist.exe.sha256)
          apk=$(awk '{print $1}' dist/Poltergeist-*.apk.sha256)
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publicar na release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            **Poltergeist ${{ github.ref_name }}** — Windows 10/11 (portátil) e
            Android 10+ (API 29, mínimo para o TLS 1.3).

            - `Poltergeist.exe` — servidor e janela do PC.
            - `Poltergeist-${{ needs.apk.outputs.version }}.apk` — app Android
              (sideload; atualiza por cima da versão anterior).
            - `*.sha256` — confira com `Get-FileHash` (Windows) ou `sha256sum`.

            **Quem tem a 2.0.0 precisa desinstalar uma vez** antes de instalar
            esta versão: a 2.0.0 usava uma chave de assinatura que ficou pública,
            e a partir da 2.0.1 o app é assinado com uma chave de release
            privada. Desinstalar apaga o pareamento salvo no app; pareie de novo
            depois. Da 2.0.1 em diante, as atualizações instalam por cima.

            SHA-256:
            ```
            ${{ steps.hashes.outputs.exe }}  Poltergeist.exe
            ${{ steps.hashes.outputs.apk }}  Poltergeist-${{ needs.apk.outputs.version }}.apk
            ```

            Nada de segredo vai dentro dos arquivos: PIN e certificado são
            criados na primeira execução.
