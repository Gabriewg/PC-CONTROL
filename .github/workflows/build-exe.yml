name: Poltergeist.exe

# Gera o executavel portatil do Windows (PyInstaller) e o SHA-256.
# Em tags v* tambem publica os dois arquivos na release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias do servidor e do build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install pyinstaller

      - name: Conferir versao do server.py com a tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re, sys
          codigo = open("server/server.py", encoding="utf-8").read()
          versao = re.search(r'VERSION = "([^"]+)"', codigo).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if versao != tag:
              sys.exit(f"tag {tag} != VERSION {versao} em server.py")

      - name: Gerar icones
        working-directory: server
        run: python gerar_icone_exe.py

      - name: Empacotar
        working-directory: server
        run: python -m PyInstaller Poltergeist.spec --noconfirm --clean

      - name: Garantir que nenhum segredo entrou no pacote
        working-directory: server
        shell: pwsh
        run: |
          $segredos = @("pin.txt", "devices.json", "auth_state.json", "cert.pem", "key.pem", "server.log")
          foreach ($s in $segredos) {
            if (Test-Path "dist/$s") { throw "Arquivo sensivel encontrado no pacote: dist/$s" }
          }

      - name: Checksum SHA-256
        working-directory: server
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Poltergeist.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Poltergeist.exe" | Set-Content dist/Poltergeist.exe.sha256 -Encoding ascii
          "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Guardar o executavel e o checksum
        uses: actions/upload-artifact@v4
        with:
          name: Poltergeist-windows
          if-no-files-found: error
          path: |
            server/dist/Poltergeist.exe
            server/dist/Poltergeist.exe.sha256

      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server/dist/Poltergeist.exe
            server/dist/Poltergeist.exe.sha256
          body: |
            **Poltergeist ${{ github.ref_name }}** (Windows 10/11, portatil)

            Baixe `Poltergeist.exe`, rode e pronto: a tela cria o PIN e o
            certificado na primeira execucao (nada de segredo vai dentro do
            arquivo).

            SHA-256 do `Poltergeist.exe`:
            ```
            ${{ env.SHA256 }}  Poltergeist.exe
            ```

            Para conferir no PowerShell:
            ```powershell
            Get-FileHash .\Poltergeist.exe -Algorithm SHA256
            ```
